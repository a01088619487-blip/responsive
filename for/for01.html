<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- for 반복문 : 같은 코드를 여러번 실행할 때 사용하는 반복문 -->
    <script>
      //   console.log("안녕하세욧/");
      //   console.log("안녕하세욧/");
      //   console.log("안녕하세욧/");
      //   console.log("안녕하세욧/");
      //   console.log("안녕하세욧/");
      //   이걸 다섯번 출력을 하고싶을때
      //for기본형
      //for(시작;조건;증가){실행코드}가 들어간다   ; 세미콜롬이 들어감
      for (let i = 0; i < 5; i++) {
        //let i = 0(시작) ; i <5(조건) ; i++(증가)  ->i가0부터 시작해서 5보다 작을시 i는 계속 증가할것이다.
        //console.log(i); //스크린샷 2026-10-22 113959
      }
      for (let i = 1; i <= 10; i++) {
        console.log(i); //스크린샷 2026-10-22 114225
        //1부터 시작해서 10까지 끝난다
      }
      // 1부터 10 까지 더한 값을 출력
      let sum = 0;
      for (let a = 1; a <= 7; a++) {
        sum += a; // 0+1
      }
      document.write(sum); //0+1=1 1+1=2 2+1=3 3+1=4 5+1=6 6+1=7 7+1=8 까지 1에서 7번 반복해서 8이 출력됨
      //안녕하세요 5번 출력
      for (let v = 1; v <= 5; v++) {
        document.write(`안녕하세요 ${v} 반가워요<br>`);
      }
      // 1~10 중에 짝수만 출력
      for (let n = 1; n <= 35; n++) {
        //console.log(n);
        if (n % 2 === 0) {
          document.write(`${n}(짝수)<br>`);
          // n=1에서 시작해서 35안에있는 짝수만 가져오겟다
        }
      }
      for (let n = 1; n <= 35; n++) {
        if (n % 2 === 1) {
          document.write(`${n}(홀수)<br>`);
          // n=1에서 시작해서 35안에있는 홀수만 가져오겟다
        }
      }
      //    별찍기
      for (let i = 1; i <= 5; i++) {
        document.write(`${"★".repeat(i)}<br>`); //별 1부터 5개 까지 출력 다함
      }
      document.write("★".repeat(5)); // 별 5개만 출력하고
    </script>
  </body>
</html>
