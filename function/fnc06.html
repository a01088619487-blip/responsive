<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메뉴버튼을 내용을 열어주고 닫아주는 function</title>
  </head>
  <body>
    <button id="menuBtn1">메뉴 1</button>
    <button id="menuBtn2">메뉴 2</button>
    <button id="menuBtn3">메뉴 3</button>
    <div id="menu1" style="display: none">메뉴 내용1</div>
    <div id="menu2" style="display: none">메뉴 내용2</div>
    <div id="menu3" style="display: none">메뉴 내용3</div>
    <script>
      //메뉴 보이게 하는 함수
      function toggleMenu(id) {
        console.log(id);

        let menu = document.getElementById(id);
        //getElementById 찾는 방식 오직 ID만 가능
        // getElementById 괄호 안 작성법 "00ID"
        //  유연성은 오직 ID만
        console.log(menu);
        if (menu.style.display === "none") {
          menu.style.display = "block";
          // 만약에 메뉴의 스타일 디스플레이가 none 과 같으면 block으로바꾸고
        } else {
          menu.style.display = "none";
          //디스플레이 none이 아니면 none으로 바꿔라
        }
      }
      const menuBtn1 = document.getElementById("menuBtn1");
      const menuBtn2 = document.getElementById("menuBtn2");
      const menuBtn3 = document.getElementById("menuBtn3");
      menuBtn1.addEventListener("click", () => {
        toggleMenu("menu1");
      }); // toggleMen가 id로 값[메뉴1]을 받아온것
      menuBtn2.addEventListener("click", () => {
        toggleMenu("menu2");
      });
      menuBtn3.addEventListener("click", () => {
        toggleMenu("menu3");
      });
    </script>
  </body>
</html>
