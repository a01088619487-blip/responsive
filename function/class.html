<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상세보기 예제</title>
    <link rel="stylesheet" href="css/class.css">
    <script src="js/class.js" ></script>
    <!-- deper 안쓰고 하는법은  class.js에 있음 -->
     <!-- <script src="js/class.js" deper ></script> -->
  </head>

  <body>
    <div class="contain">
      <img src="imge/7274_7972_249.jpg" alt="냉이꽃" />
      <button class="over" id="open">상세 설명 보기</button>
      <!-- 상세 설명보기 -->
      <div class="detail" id="detail">
        <h4>냉이 꽃</h4>
        <p>
          주로 4월에서 6월 사이에 피며, 꽃줄기 아래쪽부터 위쪽으로 차례대로
          올라가며 핍니다. 열매의 형태: 꽃이 진 후 맺히는 열매는 가운데가 움푹
          파인 역삼각형(하트 모양)을 하고 있어 서양에서는 '목동의 지갑'이라고도
          불립니다.
        </p>
        <button class="over" id="close">상세 설명 닫기</button>

        
      </div>
    </div>
  </body>
</html>
