<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>토글(toggle)서브메뉴 구현</title>
    <style>
      .submenu {
        display: none;
      }
      /* active 클래스가 붙으면 보이기 */
      .submenu.active {
        display: block;
      }
      /* 서브메뉴에 active클래스를 더해지게 할거다 on기능? */
      /* .submenu.show{ }
         */
     
    </style>
  </head>
  <body>
    <button class="menu">메뉴1</button>
    <ul class="submenu">
      <li>서브메뉴 1</li>
      <li>서브메뉴 2</li>
    </ul>
    <script>
      const menu = document.querySelector(".menu");
      const submenu = document.querySelector(".submenu");
      menu.addEventListener("click", function () {
        submenu.classList.toggle("active");
        // 드롭다운(toggle)
      });
    </script>
  </body>
</html>
