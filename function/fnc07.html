<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>토글(toggle)서브메뉴 구현</title>
    <style>
      .submenu {
        display: none;
      }
      /* active 클래스가 붙으면 보이기 */
      .submenu.active {
        display: block;
      }
      /* 서브메뉴에 active클래스를 더해지게 할거다 on기능? */
      /* .submenu.show{ }
         */
    </style>
  </head>
  <body>
    <button class="menu">메뉴1</button>
    <ul class="submenu">
      <li>서브메뉴 1</li>
      <li>서브메뉴 2</li>
    </ul>
    <script>
      const menu = document.querySelector(".menu");
      const submenu = document.querySelector(".submenu");
      menu.addEventListener("click", function () {
        // submenu.classList.toggle("active"); // 드롭다운(toggle)
       
        //위에잇는 toggle기능 대신 쓰는법
        if (submenu.classList.contains("active")) {
            //만약 active 클래스가 이미 들어잇다면 true
          submenu.classList.remove("active");
          //submenu.classList.remove("active") 를 실행해서 active클래스를 숨겨라[remove]

        } else { //반대로 클래스가 들어잇지않다면 false
          submenu.classList.add("active");
        } //submenu.classList.add("active")를 실행해서 active클래스를 보여라
        // 클래스속성중에 있는지 없는지 show 확인하기
      });
    </script>
  </body>
</html>
