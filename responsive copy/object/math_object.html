<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 객체</title>
</head>
<body>
    <script>
        let num = 2.223;
        let maxNum = Math.max(10,5,8,30);
        // console.log(maxNum);//30출력
        let minNum = Math.min(10,5,8,30);
        // console.log(minNum); //5출력
        // round(): 소수점 첫째 자리에서 반올림
        let roundNum = Math.round(num);
        console.log(roundNum); //2.6을 3으로반올림해서 출력
        // floor() :소수점 버리고 내림(정수로 변환)
        let floorNum = Math.floor(num);
        console.log(floorNum); // 2출력
        // ceil() : 소수점을 올림하여 정수로 변환
        let ceilNum = Math.ceil(num);
        console.log(ceilNum); //3출력
        // random() 0이상 1사이의 난수  (ex: 0.8214)
        let randomNum=Math.random();
        console.log(randomNum); // 0.12348132 랜덤으로 나옴
        // PI(원주율 값을 반환)
        let piNum = Math.PI
        console.log(piNum); //3.141592653589..

        
        
                
    </script>

    
</body>
</html>
