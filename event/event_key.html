<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Event</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: dimgray;
        margin-bottom: 20px;
      }
      .box1.active {
        background-color: rgb(201, 255, 147);
      }
      .box2.active {
        background-color: rgb(164, 214, 255);
      }
      .box3.active {
        background-color: rgb(193, 159, 255);
      }
      .box4.active {
        background-color: rgb(255, 122, 122);
      }
    </style>
  </head>
  <body>
    <h1>keyup 이벤트</h1>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>
    <div class="box box4">box4</div>
    <script>
      document.addEventListener("keyup", (e) => {
        console.log(e);
        let keyB = e.key.toLowerCase();
        // let 을 쓴이유는 처음에는 텅 빈 상자(null)로 시작하지만, 
        // 키를 누를 때마다 안에 들어가는 박스가 계속 바뀔(재할당될) 예정이기 때문에 let을 쓴 것

        // e.key.toLowerCase 누르는 키보드이름을 대문자 없이 소문자로 변환하겟다
        console.log(keyB);
        let box = null;
        if (keyB === "enter") {
          box = document.querySelector(".box1");
        } // 키를 엔터누르면  박스 1에 담긴다
        else if (keyB === "shift") {
          box = document.querySelector(".box2");
        } else if (keyB === "arrowup") {
          box = document.querySelector(".box3");
        } else if (keyB === "arrowdown") {
          box = document.querySelector(".box4");
        }

        if (box != null) {
            //  != 같지않다
          //만약 상자 변수가 텅 비어있지 않다면(즉,지정한 키를 제대로 눌러서 박스가 잘 찾아졌다면 의 조건문
          box.classList.add("active");
          // box.classList 가져와서 active라는 이름표를 추가해라
        }
        //지정한 키를 눌러서 박스가 잘 선택되었다면, 그 박스에 active라는 이름표를 달아줘서 색이 변하게 만들어라!
      });
    </script>
  </body>
</html>
