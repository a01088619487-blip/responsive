<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 속성 가져오거나 수정하기 메서드 -->
    <a href="https://www.naver.com"> 네이버 </a>
    <script>
      //태그 안에 있는 속성 가져오는 메서드
      // 기본형 getAttribute("속성명")
      const aEl = document.querySelector("a");
      // console.log(aEl); 확인완 aEl안에 a태그를 담음
      const hrefE = aEl.getAttribute("href");
      console.log(hrefE);
      //    속성을 수정하는 메서드
      // 기본형 : setAttribute("속성명","값")
      aEl.setAttribute("href", "https://www.google.com");
      console.log(aEl);
      aEl.innerText = "구글";
      // 추가도 가능!!
      aEl.setAttribute("target", "_blank"); //스크린샷 2026-10-19 105803
      aEl.setAttribute("title", "구글로 이동");
      aEl.setAttribute("classe", "link");
      aEl.setAttribute("id", "google_link");//스크린샷 2026-10-19 105946
      
    </script>
  </body>
</html>
