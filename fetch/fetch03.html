<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #result{
            max-width: 1000px;
            flex-wrap: wrap;
            display: flex;
            gap: 20px;
            background-color: antiquewhite;
        }
        .card{
            flex: 1;
            background-color: rgb(170, 176, 180);
            padding: 20px;
        }
    </style>
  </head>
  <body>
    <h1>사용자 데이터 가져오기</h1>
    <button id="loadBtn">데이터 가져오기</button>
    <div id="result">
      <!-- js출력 -->
    </div>
    <script>
      const loadBtn = document.querySelector("#loadBtn");
      const result = document.querySelector("#result");
      loadBtn.addEventListener("click", () => {
        // 클릭 잘되는거 확인함console.log("click");
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            //console.log(res); //스크린샷 2026-10-23 110153  status: 200 이 나오는걸 확인함
            return res.json(); // return필수우우
          })
        .then((data) => {
            // console.log(data);
            result.innerHTML = data
              .map((user) => {
                // console.log(user);
                return `
                   <div class="card">
        <h2>${user.name}</h2>
        <p><strong>아이디:${user.nid}</strong></p>
        <p><strong>사용자명:${user.username}</strong></p>
        <p><strong>이메일:${user.email}</strong></p>
        <p><strong>전화번호:${user.phone}</strong></p>
        <p><strong>웹사이트:${user.website}</strong></p>
        <p><strong>주소:${user.address.city},${user.address.street},${user.address.suite}</strong>
        </p>
        <p><strong>우편번호:${user.address.zipcode}</strong></p>
        <p><strong>회사:${user.company.name}</strong></p>
       </div>
                `;
              })
              .join("");
          })
          .catch((error) => {
            console.log(error);
          });
      });
    </script>
  </body>
</html>
