<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="display">
      <!-- js출력 -->
    </div>
    <script>
      // fetch()
      // 일반적으로 서버에서 데이터를 가져올때 사용,
      // API용청이나 로컬 JSON파일을 읽는데로 활용
      // fetch 는 바로 데이터를 쓰는게 아니라 약속을??
      // 기본형식
      // fetch('주소').then('첫번째:'Response(응답)).then('두번째:'data(출력)).catch(error(처리));
      // then(Response) 서버가 보내준 응답
      // then(data) 변환이 끝난 실제 데이터 화면출력
      // catch(error)요청이나 데이터 처리 과정에서 오류가 발생했을때 처리
      // http 상태코드
      // 200-서버가 요청을 정상적으로 처리
      // 300- 요청한 주소에서 다른 주소로 이동 헤야하거나.. 이동이 발생햇음
      // 400 - 요청에 문제가 있다
      // 500 - 서버에 문제 발생
      fetch("data.json")
        // json은... 객체를 담아넣는 파일? 공간?
        .then((response) => {
          // console.log(response); 스크린샷 2026-10-23 101830
          // 스크린샷 첫번째줄은 404(Not found) 현재로썬 파일 찾지못하는게 맞음..
          // 평소같으면 어디가 잘못되어잇는지에 확인할것
          return response.json(); // 응답 데이터를 자바스크립트에서 사용할 수 있게 변환
        })
        .then((data) => {
          //    console.log(data);//스크린샷 2026-10-23 102033 data.json에 적은ㄱㅔ 나옴.
          //return response.json() 에사 json()이 없으면 스크린샷 2026-10-23 103220  이렇게 나옴
          const displayEI = document.querySelector("#display");
        //   화면송출하기
          displayEI.innerHTML = `  
                <p>이름:${data.name}</p>
        <p>나이:${data.age}살</p>
        <p>도시:${data.city}</p>`;
        }) //스크린샷 2026-10-23 103733 
        .catch((error) => {
          console.log("오류발생:", error); //스크린샷 2026-10-23 103444
        //   fetch나 다른곳에 오류가 뜨면 오류 발생이라고 뜨게 도와줌! 두번이나 오류가 있는지 없는지를 확인하는 꼼꼼한 아이인가?'ㅅ'?
        });
        // 근데 이걸 에러가 발생할때 확인을 위해서만 쓰는건가? 다른곳에서도 쓸수잇낭??
        
    </script>
  </body>
</html>
