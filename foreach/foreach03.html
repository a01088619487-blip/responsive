<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    ul{
        display: flex;
        gap:30px
    }
    li{
        width: 200px;
        background-color: antiquewhite;
        padding: 20px;
    }
    li img {
        width: 100%;
    }
  </style>

  <body>
    <ul id="prodouctList">
      <!-- Js출력 -->
    
    </ul>
    <script>
      const proList = document.querySelector("#prodouctList");
      // 변수명은 소문자 로 시작하고 이어지게 할려면 대문자를 이용하는방법(구분하기위해)..
      //  소문자에서 pro_L(=l)ist로 하는 방법도잇다
      // 이걸 카멜법?이라고도한다고함
      // console.log(proList); 확인완
      //   더미 데이터
      const products = [
        { name: "티셔츠", price: 15000, desc: "이쁜 티셔츠", img: "images/images/tshirt.jpg"},
        { name: "청바지", price: 38000, desc: "이쁜 청바지", img:"images/images/jeans.jpg"},
        { name: "운동화", price: 250000, desc: "이쁜 운동화", img:"images/images/shoes.jpg"},
      ];
      //상품에대한 데이터 =[{속성(이름 내가 정함):값,값}]   <-객체로 묶음
    //   숫자는 "" 안에 넣지말긔 
      //   console.log(products); 확인완
      // products.forEach(function(){});
      products.forEach((item, index) => {
        // console.log(item,index);
        // console.log(item.name);
        // console.log(item.price);
        // console.log(item.desc);
        // 객체.데아터<-객체 안에잇는 데이타에게 접근(연결)하는법
        proList.innerHTML += `
        <li>
            <img src="${item.img}" alt="${item.name}">
        <h3>상품 이름 : ${item.name}</h3>
        <p>상품 설명 : ${item.desc}</p>
        <p>상품 가격 : ${item.price.toLocaleString()}원</p>
       </li>`;}
    );
    </script>
  </body>
</html>
