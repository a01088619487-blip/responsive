<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map()</title>
  </head>
  <body>
    <!-- Map()기존 데이터를 하나씩 꺼내서 다른 데이터로 바꾸고,새로운 배열로 만드는 메서드 -->
    <script>
      const prices = [1000, 2000, 3000];
      console.log(prices);
      const newPrices = prices.map((price) => {
        console.log(price); //스크린샷 2026-10-21 094126
        return price + 1000;
        // return 이라는 반환값이 꼬옥 필요.. 생각보다 return을 쓰임새 알아보자
      });
      console.log(newPrices); //다시 배열로 들어감! 스크린샷 2026-10-21 094200
      //   돌려 받은 값들을 모아서 새 배열로 만든당 / +1000가 있어서 [2000,3000,4000]으로 찍힘
      const numbers = [1, 2, 3, 4];
    //   const result = numbers.map((num)=>{
    //     console.log(num); //스크린샷 2026-10-21 094402
    //     return num *2  //return안쓰면 값이 없어서  값이 안나옴 
    //   })
    const result = numbers.map((num)=>num *2) //객체 및 리턴안써도 객체값이 나온다
    // 이때는   간단하게 쓸때는 객체를 생략가능 
    // 객체를 쓸때는 무조건 return필수임!!  
    // 이거에대해 좀더 알아보기.. 어렵다..ㅠ
    // ex-상품가격,데이터변동
      console.log(result);//스크린샷 2026-10-21 094521
      
    </script>
  </body>
</html>
