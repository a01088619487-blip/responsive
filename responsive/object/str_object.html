<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String 객체</title>
</head>
<body>
    <script>
        // 1.length 속성
        const str = "Hello, JavaScript"
        console.log(str.length); //17 출력 ,문자길이
        // 2.toUpperCase() toLowerCase() 메서드
        console.log(str.toLowerCase); //소문자
        console.log(str.toUpperCase); //대문자
        // 3.includes() 해당내용이 있는지 확인하는메서드
        const email = "uer@example.com"
        console.log(email.includes("@")); //참거짓  
        // 4.trim() 공백제거 메서드 [뒤에잇는 공백은 취급X]
        const input = " he  l  lo"
        console.log(input.length);//10 출력
        console.log(input.trim().length);//9출력  trim:공백제거 후 length 글자수를 새라  
        // 5.slice() 시작인덱스 (포함),끝인덱스(미포함,바로 앞까지만 자름)
        const str2 = "JavaScript" //모든 자바는 0부터 시작함 [그래서 0이 J ]
        console.log(str2.slice(4,9)); //Scrip
        // 6.replace() 문자교체
        const sentence = "I Like Java"
        console.log(sentence.replace("Java" , "JavaScript")); //출력 I Like JavaScript
        //7.split() 문자 분리
        const data = "apple,banana,orange"
        console.log(data.split(""));//출력 "a","p"...문자 하나하나당 "" 분리 [Array로 분리시켜줌]
        
        
        
        
        
        
        
        
        
    </script>
    
</body>
</html>
